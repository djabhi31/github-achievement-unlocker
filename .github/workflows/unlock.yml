name: 🏆 1-Click GitHub Achievement Unlocker

on:
  workflow_dispatch:
    inputs:
      badge:
        description: 'Select Badge to Unlock'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'                # Unlock All Badges
          - 'quickdraw'          # ⚡ Quickdraw (instant close)
          - 'galaxy-brain'       # 🧠 Galaxy Brain (Q&A discussions)
          - 'pair-extraordinaire'# 👥 Pair Extraordinaire (co-authored)
          - 'pull-shark'         # 🦈 Pull Shark (merged PRs)
          - 'yolo'               # 🚀 YOLO (unreviewed merge)
      tier:
        description: 'Target Tier (for Galaxy Brain, Pull Shark, Pair)'
        required: true
        default: 'max'
        type: choice
        options:
          - 'max'                # Diamond (x32) / Gold (x24)
          - 'silver'             # Silver (x16 / x10 / x8)
          - 'bronze'             # Standard Bronze (x1 / x2)
      sandbox_repo:
        description: 'Sandbox repo name'
        required: true
        default: 'my-github-achievements-sandbox'

permissions:
  contents: write
  pull-requests: write
  issues: write
  discussions: write

jobs:
  unlock-achievements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Toolkit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unlocker Engine
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python unlocker.py --automated --badge ${{ github.event.inputs.badge }} --tier ${{ github.event.inputs.tier }} --repo ${{ github.event.inputs.sandbox_repo }}
