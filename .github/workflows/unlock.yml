name: 🏆 1-Click GitHub Achievement Unlocker

on:
  workflow_dispatch:
    inputs:
      badge:
        description: 'Select Badge to Unlock'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'                # Unlock All Badges
          - 'quickdraw'          # ⚡ Quickdraw (instant close)
          - 'galaxy-brain'       # 🧠 Galaxy Brain (Q&A discussions)
          - 'pair-extraordinaire'# 👥 Pair Extraordinaire (co-authored)
          - 'pull-shark'         # 🦈 Pull Shark (merged PRs)
          - 'yolo'               # 🚀 YOLO (unreviewed merge)
      tier:
        description: 'Target Tier (for Galaxy Brain, Pull Shark, Pair)'
        required: true
        default: 'max'
        type: choice
        options:
          - 'max'                # Diamond (x32) / Gold (x24)
          - 'silver'             # Silver (x16 / x10 / x8)
          - 'bronze'             # Standard Bronze (x1 / x2)
      sandbox_repo:
        description: 'Sandbox repo name'
        required: true
      coauthor_name:
        description: 'Co-author Name (for Pair Extraordinaire)'
        required: false
        default: 'The Octocat'
      coauthor_email:
        description: 'Co-author GitHub Email (must be verified GitHub email/noreply)'
        required: false
        default: '583231+octocat@users.noreply.github.com'

permissions:
  contents: write
  pull-requests: write
  issues: write
  discussions: write

jobs:
  unlock-achievements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Toolkit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Personal Access Token
        env:
          PAT_SET: ${{ secrets.PERSONAL_ACCESS_TOKEN != '' }}
        run: |
          if [ "$PAT_SET" != "true" ]; then
            echo "::error::Repository secret 'PERSONAL_ACCESS_TOKEN' is missing!"
            echo "GitHub Achievements cannot be unlocked by the default github-actions[bot] token."
            echo "Create a PAT with 'repo' scope at https://github.com/settings/tokens/new?scopes=repo,workflow"
            echo "Add it under: Settings -> Secrets and variables -> Actions -> New repository secret (Name: PERSONAL_ACCESS_TOKEN)"
            exit 1
          fi

      - name: Run Unlocker Engine
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          python unlocker.py --automated \
            --badge "${{ github.event.inputs.badge }}" \
            --tier "${{ github.event.inputs.tier }}" \
            --repo "${{ github.event.inputs.sandbox_repo }}" \
            --coauthor-name "${{ github.event.inputs.coauthor_name }}" \
            --coauthor-email "${{ github.event.inputs.coauthor_email }}"

